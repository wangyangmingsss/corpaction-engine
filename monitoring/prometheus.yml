global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'prometheus.rules.yml'

scrape_configs:
  - job_name: 'ingestion'
    static_configs:
      - targets: ['ingestion:9100']
    metrics_path: /metrics

  - job_name: 'processor'
    static_configs:
      - targets: ['processor:9100']
    metrics_path: /metrics

  - job_name: 'validator'
    static_configs:
      - targets: ['validator:9100']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
