name: Integration Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corpaction_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build Contracts
        run: cd packages/contracts && forge build

      - name: Run Contract Tests
        run: cd packages/contracts && forge test -vvv

      - name: Build SDK
        run: cd packages/sdk && npm ci && npm run build

      - name: Test SDK
        run: cd packages/sdk && npm test

      - name: Init Database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d corpaction_test -f packages/services/db/init.sql

      - name: Build Services
        run: |
          cd packages/services/ingestion && npm ci && npm run build && cd ../../..
          cd packages/services/processor && npm ci && npm run build && cd ../../..
          cd packages/services/validator && npm ci && npm run build && cd ../../..

      - name: Test Services
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/corpaction_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd packages/services/ingestion && npm test && cd ../../..
          cd packages/services/processor && npm test && cd ../../..
          cd packages/services/validator && npm test && cd ../../..

      - name: Start Anvil
        run: anvil --fork-url ${{ secrets.RPC_URL || 'http://localhost:8545' }} &

      - name: Run Integration Smoke Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/corpaction_test
          REDIS_URL: redis://localhost:6379
          RPC_URL: http://localhost:8545
        run: |
          # Deploy contracts to local Anvil instance
          cd packages/contracts
          DEPLOY_OUTPUT=$(forge script script/Deploy.s.sol --rpc-url $RPC_URL --broadcast 2>&1) || {
            echo "Contract deployment failed"; echo "$DEPLOY_OUTPUT"; exit 1;
          }
          echo "Contracts deployed successfully"
          cd ../..

          # Start ingestion service in background and verify it starts
          cd packages/services/ingestion
          node dist/index.js &
          INGESTION_PID=$!
          sleep 5
          if ! kill -0 $INGESTION_PID 2>/dev/null; then
            echo "Ingestion service failed to start"; exit 1;
          fi
          echo "Ingestion service started (PID $INGESTION_PID)"
          cd ../../..

          # Start processor service in background and verify it starts
          cd packages/services/processor
          node dist/index.js &
          PROCESSOR_PID=$!
          sleep 5
          if ! kill -0 $PROCESSOR_PID 2>/dev/null; then
            echo "Processor service failed to start"; exit 1;
          fi
          echo "Processor service started (PID $PROCESSOR_PID)"
          cd ../../..

          # Start validator service in background and verify it starts
          cd packages/services/validator
          node dist/index.js &
          VALIDATOR_PID=$!
          sleep 5
          if ! kill -0 $VALIDATOR_PID 2>/dev/null; then
            echo "Validator service failed to start"; exit 1;
          fi
          echo "Validator service started (PID $VALIDATOR_PID)"
          cd ../../..

          # Verify database has expected tables from init.sql
          TABLES=$(PGPASSWORD=postgres psql -h localhost -U postgres -d corpaction_test -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          if [ "$(echo $TABLES | tr -d ' ')" -lt 1 ]; then
            echo "Database schema not initialized properly"; exit 1;
          fi
          echo "Database schema verified"

          # Verify Redis is accepting connections from services
          redis-cli -h localhost ping | grep -q PONG || { echo "Redis not responding"; exit 1; }
          echo "Redis connectivity verified"

          # Insert a test corporate action event and verify processing
          PGPASSWORD=postgres psql -h localhost -U postgres -d corpaction_test -c "
            INSERT INTO events (source, source_id, event_type, raw_data, status)
            VALUES ('SMOKE_TEST', 'smoke-001', 'dividend', '{\"test\": true}', 'pending')
            ON CONFLICT DO NOTHING;
          " || { echo "Failed to insert test event"; exit 1; }
          echo "Test event inserted"

          # Allow time for services to pick up and process the event
          sleep 10

          # Cleanup background services
          kill $INGESTION_PID $PROCESSOR_PID $VALIDATOR_PID 2>/dev/null || true
          wait $INGESTION_PID $PROCESSOR_PID $VALIDATOR_PID 2>/dev/null || true
          echo "Integration smoke test completed successfully"
