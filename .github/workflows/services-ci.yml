name: Services CI
on:
  push:
    paths: ['packages/services/**', 'packages/sdk/**']
  pull_request:
    paths: ['packages/services/**', 'packages/sdk/**']

jobs:
  build-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install & Build
        run: cd packages/services/ingestion && npm ci && npm run build
      - name: Test
        run: cd packages/services/ingestion && npm test

  build-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install & Build
        run: cd packages/services/processor && npm ci && npm run build
      - name: Test
        run: cd packages/services/processor && npm test

  build-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install & Build
        run: cd packages/services/validator && npm ci && npm run build
      - name: Test
        run: cd packages/services/validator && npm test

  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install & Build
        run: cd packages/sdk && npm ci && npm run build
      - name: Test
        run: cd packages/sdk && npm test
