version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corpaction
      POSTGRES_USER: corpaction
      POSTGRES_PASSWORD: ${DB_PASSWORD:-corpaction_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/services/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corpaction']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb
    volumes: [redis_data:/data]
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s

  ingestion:
    build:
      context: .
      dockerfile: packages/services/ingestion/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://corpaction:${DB_PASSWORD:-corpaction_dev}@postgres:5432/corpaction
      REDIS_URL: redis://redis:6379
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-CorpActionEngine/1.0}
      EOD_API_KEY: ${EOD_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-20250514}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: packages/services/processor/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://corpaction:${DB_PASSWORD:-corpaction_dev}@postgres:5432/corpaction
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL:-http://localhost:8545}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      VALIDATOR_PRIVATE_KEY: ${VALIDATOR_PRIVATE_KEY:-}
    restart: unless-stopped

  validator:
    build:
      context: .
      dockerfile: packages/services/validator/Dockerfile
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL:-http://localhost:8545}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      VALIDATOR_PRIVATE_KEY: ${VALIDATOR_PRIVATE_KEY:-}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    ports: ['3000:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://corpaction:${DB_PASSWORD:-corpaction_dev}@postgres:5432/corpaction?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['9187:9187']

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    ports: ['9121:9121']

volumes:
  postgres_data:
  redis_data:
  grafana_data:
